name: Extract Zip to Root

# Run this manually from the "Actions" tab in your repo whenever you
# want to (re-)extract a zip file that's committed in the repo into
# the repo root. Change ZIP_PATH below if your zip has a different
# name/location.
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to the zip file in the repo (relative to root)"
        required: true
        default: "Smiley-Cymor-MD.zip"
      delete_zip_after:
        description: "Delete the zip file after extracting it?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract zip to repo root
        run: |
          ZIP_PATH="${{ github.event.inputs.zip_path }}"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Zip file not found at '$ZIP_PATH'. Check the path/name and try again."
            exit 1
          fi

          echo "Extracting $ZIP_PATH to repo root..."
          unzip -o "$ZIP_PATH" -d .

          # If the zip contained a single top-level folder (e.g. "bot/"),
          # move its contents up to root so files land directly in root
          # instead of inside that subfolder.
          TOP_LEVEL_DIRS=$(unzip -Z1 "$ZIP_PATH" | awk -F/ '{print $1}' | sort -u)
          DIR_COUNT=$(echo "$TOP_LEVEL_DIRS" | wc -l)

          if [ "$DIR_COUNT" -eq 1 ] && [ -d "$TOP_LEVEL_DIRS" ]; then
            echo "Detected single top-level folder '$TOP_LEVEL_DIRS' — flattening into root."
            shopt -s dotglob
            mv "$TOP_LEVEL_DIRS"/* .
            rmdir "$TOP_LEVEL_DIRS"
          fi

      - name: Delete zip file
        if: ${{ github.event.inputs.delete_zip_after == 'true' }}
        run: rm -f "${{ github.event.inputs.zip_path }}"

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Extract ${{ github.event.inputs.zip_path }} to repo root"
            git push
          fi
